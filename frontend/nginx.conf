
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy → deployed FastAPI backend
    location /api/ {
        proxy_pass https://ai-expense-agent-api.onrender.com;

        # Fix HTTPS/TLS handshake with Render
        proxy_ssl_server_name on;
        proxy_ssl_name ai-expense-agent-api.onrender.com;

        # Forward the correct upstream hostname
        proxy_set_header Host ai-expense-agent-api.onrender.com;

        # Forward client and request information
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow time for AI/LLM responses
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React/Vite single-page application fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
